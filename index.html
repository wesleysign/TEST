<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartão de Aniversário Interativo</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Quicksand:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --card-bg: rgba(255, 255, 255, 0.95);
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        box-sizing: border-box;
        font-family: "Quicksand", sans-serif;
        overflow: auto;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes confettiFall {
        0% {
          transform: translateY(-60px) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(500px) rotate(720deg);
          opacity: 0;
        }
      }

      @keyframes scaleIn {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.15);
        }
      }

      @keyframes slideUp {
        0% {
          transform: translateY(30px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .card-enter {
        animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .float {
        animation: float 3s ease-in-out infinite;
      }

      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        top: -20px;
        animation: confettiFall linear forwards;
        pointer-events: none;
      }

      .sparkle {
        animation: sparkle 1.5s ease-in-out infinite;
      }

      .pulse-hover:active {
        animation: pulse 0.3s ease;
      }

      .slide-up {
        animation: slideUp 0.6s ease forwards;
      }

      .cake-wrapper {
        cursor: pointer;
        transition: transform 0.3s;
      }

      .cake-wrapper:hover {
        transform: scale(1.05);
      }

      .candles-lit .flame {
        opacity: 1;
      }

      .candles-out .flame {
        opacity: 0;
        transition: opacity 0.3s;
      }

      @media (prefers-reduced-motion: reduce) {
        .card-enter,
        .float,
        .sparkle,
        .slide-up,
        .pulse-hover:active,
        .confetti-piece {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body class="h-full w-full">
    <main
      id="app"
      class="h-full w-full flex items-center justify-center p-4"
      style="background: linear-gradient(135deg, #4a90d9 0%, #d4729c 100%)"
    >
      <div id="confetti-container" class="fixed inset-0 pointer-events-none overflow-hidden" style="z-index: 50"></div>

      <section
        id="card"
        class="card-enter relative w-full max-w-md rounded-3xl shadow-2xl overflow-hidden"
        style="background: var(--card-bg); backdrop-filter: blur(10px)"
      >
        <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
          <svg class="sparkle absolute" style="top: 10%; left: 8%; animation-delay: 0s" width="18" height="18">
            <polygon points="9,0 11,7 18,7 12,11 14,18 9,14 4,18 6,11 0,7 7,7" fill="#fbbf24" />
          </svg>
          <svg class="sparkle absolute" style="top: 5%; right: 12%; animation-delay: 0.5s" width="14" height="14">
            <polygon points="7,0 9,5 14,5 10,8 11,14 7,10 3,14 4,8 0,5 5,5" fill="#f472b6" />
          </svg>
          <svg class="sparkle absolute" style="bottom: 15%; left: 10%; animation-delay: 1s" width="12" height="12">
            <polygon points="6,0 7,4 12,4 8,7 9,12 6,9 3,12 4,7 0,4 5,4" fill="#60a5fa" />
          </svg>
          <svg class="sparkle absolute" style="bottom: 20%; right: 8%; animation-delay: 0.7s" width="16" height="16">
            <polygon points="8,0 10,6 16,6 11,9 13,16 8,12 3,16 5,9 0,6 6,6" fill="#a78bfa" />
          </svg>
        </div>

        <div class="relative p-8 text-center">
          <div class="float mx-auto mb-4" style="width: 60px; animation-delay: 0.2s" aria-hidden="true">
            <svg viewBox="0 0 80 120" width="60">
              <ellipse cx="40" cy="40" rx="28" ry="35" fill="#f472b6" opacity="0.9" />
              <ellipse cx="35" cy="30" rx="6" ry="10" fill="white" opacity="0.3" transform="rotate(-20 35 30)" />
              <polygon points="40,75 36,80 44,80" fill="#f472b6" />
              <line x1="40" y1="80" x2="40" y2="115" stroke="#d4729c" stroke-width="1.5" />
            </svg>
          </div>

          <h1 id="greeting" class="text-3xl font-bold mb-1 slide-up" style="font-family: 'Playfair Display', serif; color: #4a4068">
            Feliz Aniversário!
          </h1>
          <h2 id="recipient" class="text-5xl font-bold mb-4 slide-up" style="font-family: 'Playfair Display', serif; color: #d4729c; animation-delay: 0.15s">
            Emma
          </h2>

          <button
            id="cake-area"
            type="button"
            class="cake-wrapper candles-lit mx-auto mb-5 pulse-hover"
            style="width: 120px"
            title="Clique para soprar as velas"
            aria-label="Soprar velas"
          >
            <svg viewBox="0 0 120 100" width="120" aria-hidden="true">
              <rect x="20" y="50" width="80" height="35" rx="6" fill="#fbbf24" />
              <rect x="20" y="50" width="80" height="12" rx="6" fill="#f59e0b" />
              <ellipse cx="35" cy="50" rx="6" ry="8" fill="#fde68a" />
              <ellipse cx="60" cy="50" rx="7" ry="10" fill="#fde68a" />
              <ellipse cx="85" cy="50" rx="5" ry="7" fill="#fde68a" />
              <rect x="38" y="30" width="4" height="20" rx="2" fill="#f472b6" />
              <rect x="58" y="25" width="4" height="25" rx="2" fill="#60a5fa" />
              <rect x="78" y="32" width="4" height="18" rx="2" fill="#a78bfa" />

              <ellipse class="flame" cx="40" cy="26" rx="4" ry="6" fill="#fbbf24">
                <animate attributeName="ry" values="6;7;5;6" dur="0.4s" repeatCount="indefinite" />
              </ellipse>
              <ellipse class="flame" cx="60" cy="21" rx="4" ry="6" fill="#fb923c">
                <animate attributeName="ry" values="5;7;6;5" dur="0.5s" repeatCount="indefinite" />
              </ellipse>
              <ellipse class="flame" cx="80" cy="28" rx="4" ry="6" fill="#fbbf24">
                <animate attributeName="ry" values="6;5;7;6" dur="0.45s" repeatCount="indefinite" />
              </ellipse>
              <circle cx="60" cy="47" r="5" fill="#ef4444" />
            </svg>
          </button>

          <p id="cake-hint" class="text-xs mt-1" style="color: #a78bfa">🎂 Clique para soprar as velas!</p>
          <p id="sub-message" class="text-lg mb-6 slide-up" style="color: #6b7280; animation-delay: 0.3s">Desejando alegria e felicidade para você.</p>

          <button
            id="celebrate-btn"
            type="button"
            class="px-6 py-3 rounded-full text-white font-semibold text-lg shadow-lg transition-all duration-300 hover:shadow-xl active:scale-95"
            style="background: linear-gradient(135deg, #4a90d9, #d4729c)"
          >
            🎉 Celebrar!
          </button>
        </div>
      </section>
    </main>

    <script>
      "use strict";

      const defaultConfig = {
        recipient_name: "Emma",
        greeting_text: "Feliz Aniversário!",
        sub_message: "Desejando alegria e felicidade para você.",
        background_color: "#4a90d9",
        accent_color: "#d4729c",
        text_color: "#4a4068",
        font_family: "Playfair Display",
        font_size: 16,
      };

      const el = {
        app: document.getElementById("app"),
        greeting: document.getElementById("greeting"),
        recipient: document.getElementById("recipient"),
        subMessage: document.getElementById("sub-message"),
        celebrateBtn: document.getElementById("celebrate-btn"),
        cakeArea: document.getElementById("cake-area"),
        cakeHint: document.getElementById("cake-hint"),
        confettiContainer: document.getElementById("confetti-container"),
      };

      function applyConfig(config = {}) {
        const c = { ...defaultConfig, ...config };

        el.greeting.textContent = c.greeting_text;
        el.recipient.textContent = c.recipient_name;
        el.subMessage.textContent = c.sub_message;

        el.app.style.background = `linear-gradient(135deg, ${c.background_color} 0%, ${c.accent_color} 100%)`;
        el.celebrateBtn.style.background = `linear-gradient(135deg, ${c.background_color}, ${c.accent_color})`;

        el.recipient.style.color = c.accent_color;
        el.greeting.style.color = c.text_color;

        const font = `${c.font_family}, Playfair Display, serif`;
        el.greeting.style.fontFamily = font;
        el.recipient.style.fontFamily = font;

        const base = Number(c.font_size) || 16;
        el.greeting.style.fontSize = `${base * 1.9}px`;
        el.recipient.style.fontSize = `${base * 3}px`;
        el.subMessage.style.fontSize = `${base * 1.1}px`;
      }

      function setConfigKey(config, key, value) {
        config[key] = value;
        window.elementSdk.setConfig({ [key]: value });
      }

      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (v) => setConfigKey(config, "background_color", v),
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (v) => setConfigKey(config, "accent_color", v),
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (v) => setConfigKey(config, "text_color", v),
            },
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (v) => setConfigKey(config, "font_family", v),
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (v) => setConfigKey(config, "font_size", v),
          },
        }),
        mapToEditPanelValues: (config) =>
          new Map([
            ["recipient_name", config.recipient_name || defaultConfig.recipient_name],
            ["greeting_text", config.greeting_text || defaultConfig.greeting_text],
            ["sub_message", config.sub_message || defaultConfig.sub_message],
          ]),
      });

      function spawnConfetti(count = 40) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const colors = ["#f472b6", "#60a5fa", "#fbbf24", "#a78bfa", "#34d399", "#fb923c"];
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < count; i += 1) {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
          piece.style.width = `${6 + Math.random() * 8}px`;
          piece.style.height = `${6 + Math.random() * 8}px`;
          piece.style.animationDuration = `${2 + Math.random() * 2}s`;
          piece.style.animationDelay = `${Math.random() * 0.8}s`;
          fragment.appendChild(piece);
          setTimeout(() => piece.remove(), 5000);
        }

        el.confettiContainer.appendChild(fragment);
      }

      let candlesLit = true;
      el.cakeArea.addEventListener("click", () => {
        if (candlesLit) {
          el.cakeArea.classList.remove("candles-lit");
          el.cakeArea.classList.add("candles-out");
          el.cakeHint.textContent = "✨ Desejo realizado!";
          spawnConfetti(25);
        } else {
          el.cakeArea.classList.remove("candles-out");
          el.cakeArea.classList.add("candles-lit");
          el.cakeHint.textContent = "🎂 Clique para soprar as velas!";
        }
        candlesLit = !candlesLit;
      });

      el.celebrateBtn.addEventListener("click", () => spawnConfetti(50));

      applyConfig(defaultConfig);
      window.setTimeout(() => spawnConfetti(30), 800);
    </script>
  </body>
</html>
